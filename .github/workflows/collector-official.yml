name: Collector - incremental official legal archive

on:
  workflow_dispatch:
  push:
    branches: [collector-import]
    paths:
      - 'manifests/incoming/collector-official-urls.txt'
      - 'scripts/collector_official.py'
      - '.github/workflows/collector-official.yml'

permissions:
  contents: write

concurrency:
  group: collector-official
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-import
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect one safe batch
        env:
          COLLECTOR_BATCH_LIMIT: '25'
          COLLECTOR_SLEEP_SECONDS: '1.5'
        run: python scripts/collector_official.py

      - name: Commit archived originals and manifests
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No archive changes to commit.'
            exit 0
          fi
          git config user.name 'rabab-legal-collector'
          git config user.email 'collector@users.noreply.github.com'
          git add archive-sources/official-incremental manifests/collector
          git commit -m 'collector: archive next official-source batch'
          git push origin HEAD:collector-import
