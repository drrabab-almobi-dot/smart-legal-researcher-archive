name: Import MOJ judgment PDFs

on:
  push:
    paths:
      - '.github/workflows/import-moj-judgments.yml'
      - 'manifests/incoming/moj-judgments-1434-1435-urls.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download verified PDFs and update registers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/moj/1434 sources/moj/1435 manifests/import-logs
          LOG="manifests/import-logs/moj-judgments-1434-1435.csv"
          if [ ! -f "$LOG" ]; then
            echo 'url,path,sha256,bytes,status' > "$LOG"
          fi
          while IFS= read -r url; do
            case "$url" in
              https://www.moj.gov.sa/*AhkamGroup_1434/*.pdf)
                year=1434 ;;
              https://www.moj.gov.sa/*AhkamGroup_1435/*.pdf)
                year=1435 ;;
              *) continue ;;
            esac
            n=$(basename "$url" .pdf)
            dest="sources/moj/$year/moj-judgments-$year-volume-$n.pdf"
            if [ -f "$dest" ]; then
              echo "$url,$dest,,,already_present" >> "$LOG"
              continue
            fi
            tmp=$(mktemp)
            if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 "$url" -o "$tmp"; then
              echo "$url,$dest,,,download_failed" >> "$LOG"
              rm -f "$tmp"
              continue
            fi
            if [ "$(head -c 4 "$tmp" 2>/dev/null || true)" != "%PDF" ]; then
              echo "$url,$dest,,,not_pdf" >> "$LOG"
              rm -f "$tmp"
              continue
            fi
            sha=$(sha256sum "$tmp" | awk '{print $1}')
            bytes=$(stat -c%s "$tmp")
            if grep -Fq "$sha" manifests/source-register.csv 2>/dev/null; then
              echo "$url,$dest,$sha,$bytes,duplicate_sha" >> "$LOG"
              rm -f "$tmp"
              continue
            fi
            mv "$tmp" "$dest"
            echo "$url,$dest,$sha,$bytes,imported" >> "$LOG"
          done < manifests/incoming/moj-judgments-1434-1435-urls.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/moj manifests/import-logs
          if git diff --cached --quiet; then
            echo 'No new PDFs to commit.'
          else
            git commit -m 'استيراد ملفات أحكام وزارة العدل 1434-1435'
            git push
          fi
