name: Collector - index with researcher boundaries

on:
  push:
    branches: [collector-import]
    paths:
      - '.github/workflows/index-collector-from-researcher-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-import
          fetch-depth: 1
          lfs: true
      - name: Fetch originals and researcher index
        shell: bash
        run: |
          git lfs pull
          git fetch origin main --depth=1
          git show origin/main:indices/case-register.ndjson > /tmp/researcher-case-register.ndjson
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
      - name: Split and index collector sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted/collector-judgments
          mkdir -p extracted/collector-judgments indices/collector manifests/collector
          python3 - <<'PY'
          import csv, hashlib, json, re, subprocess
          from pathlib import Path

          pdfs={p.name:p for p in Path('archive-sources').rglob('*.pdf')}
          records=[]
          for line in Path('/tmp/researcher-case-register.ndjson').read_text(encoding='utf-8',errors='ignore').splitlines():
              try:r=json.loads(line)
              except:continue
              src=r.get('sourceFile') or (r.get('archive') or {}).get('originalSourceFile')
              if src in pdfs:
                  records.append(r)

          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()

          tr=str.maketrans('٠١٢٣٤٥٦٧٨٩','0123456789')
          date_rx=[
              re.compile(r'(?:تاريخ\s*(?:الحكم|الصك|القرار|الجلسة)?\s*[:：-]?\s*)([0-9٠-٩]{1,2}\s*[/\-]\s*[0-9٠-٩]{1,2}\s*[/\-]\s*1[34][0-9٠-٩]{2})'),
              re.compile(r'([0-9٠-٩]{1,2}\s*[/\-]\s*[0-9٠-٩]{1,2}\s*[/\-]\s*1[34][0-9٠-٩]{2}\s*هـ?)')]
          def date_of(txt):
              for rx in date_rx:
                  m=rx.search(txt)
                  if m:return m.group(1).translate(tr).replace(' ','')
              return None

          out_nd=[]; out_csv=[]; counts={}; skipped=[]
          for r in records:
              src=r.get('sourceFile') or (r.get('archive') or {}).get('originalSourceFile')
              a=r.get('archive') or {}
              start=a.get('originalStartPage'); end=a.get('originalEndPage')
              if not (isinstance(start,int) and isinstance(end,int) and start>0 and end>=start):
                  skipped.append([r.get('id'),src,'missing_page_boundaries']); continue
              pdf=pdfs[src]
              rid='collector-'+str(r.get('id') or f'{src}-p{start}')
              rid=re.sub(r'[^A-Za-z0-9_-]','-',rid)
              out=Path('extracted/collector-judgments')/(rid+'.pdf')
              subprocess.run(['qpdf',str(pdf),'--pages',str(pdf),f'{start}-{end}','--',str(out)],check=True)
              text=subprocess.run(['pdftotext','-f',str(start),'-l',str(end),'-layout',str(pdf),'-'],capture_output=True,text=True,errors='ignore').stdout or ''
              d=date_of(text)
              s=sha(out); size=out.stat().st_size
              rec={
                'id':rid,
                'documentType':'حكم قضائي',
                'caseTitle':r.get('title') or r.get('caseTitle') or '',
                'title':r.get('title') or r.get('caseTitle') or '',
                'caseNumber':r.get('lawsuitNumber') or r.get('caseNumber'),
                'lawsuitNumber':r.get('lawsuitNumber') or r.get('caseNumber'),
                'deedNumber':r.get('deedNumber'),
                'decisionDate':d,
                'hijriDate':d,
                'volume':r.get('volume'),
                'year':r.get('year'),
                'sourceFile':src,
                'sourceChecksum':sha(pdf),
                'file':out.name,
                'fileChecksum':s,
                'pages':end-start+1,
                'reviewStatus':'indexed_from_researcher_verified_boundaries',
                'archive':{'granularity':'case','originalSourceFile':src,'originalStartPage':start,'originalEndPage':end,'preservedOriginalPages':True}
              }
              out_nd.append(rec)
              out_csv.append([rid,out.name,src,start,end,end-start+1,s,size,True,rec['caseTitle'],rec['caseNumber'],rec['deedNumber'],d])
              counts[src]=counts.get(src,0)+1

          Path('indices/collector/case-register.ndjson').write_text(''.join(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n' for x in out_nd),encoding='utf-8')
          with open('manifests/collector/judgment-file-register.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['id','file','source_file','start_page','end_page','pages','sha256','bytes','preserved_original_pages','case_title','case_number','deed_number','decision_date']); w.writerows(out_csv)
          with open('manifests/collector/source-case-counts.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['source_file','indexed_cases']); w.writerows(sorted(counts.items()))
          with open('manifests/collector/skipped-records.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['id','source_file','reason']); w.writerows(skipped)
          print('IMPORTED_SOURCES=',len(pdfs))
          print('MATCHED_RESEARCHER_RECORDS=',len(records))
          print('INDEXED_CASES=',len(out_nd))
          print('SOURCES_WITH_CASES=',len(counts))
          print('SKIPPED=',len(skipped))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extracted/collector-judgments indices/collector manifests/collector
          if ! git diff --cached --quiet; then
            git commit -m 'collector: فهرسة الأحكام وفق حدود الباحثة الموثقة'
            git push origin collector-import
          fi
