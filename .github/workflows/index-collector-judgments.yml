name: Collector - index extracted judgments

on:
  push:
    branches: [collector-import]
    paths:
      - 'archive-sources/**/*.pdf'
      - '.github/workflows/index-collector-judgments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    if: github.ref == 'refs/heads/collector-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-import
          fetch-depth: 1
          lfs: true
      - name: Ensure LFS objects are present
        run: git lfs pull
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
      - name: Build collector-only judgment index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/collector-judgments indices/collector manifests/collector
          rm -f indices/collector/case-register.ndjson manifests/collector/judgment-file-register.csv manifests/collector/processing-log.csv
          python3 - <<'PY'
          import csv, hashlib, json, re, subprocess, unicodedata
          from pathlib import Path

          pdfs = sorted(Path('archive-sources').rglob('*.pdf')) if Path('archive-sources').exists() else []
          case_index = Path('indices/collector/case-register.ndjson')
          file_register = Path('manifests/collector/judgment-file-register.csv')
          processing = Path('manifests/collector/processing-log.csv')

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()

          def pdf_pages(path):
              p=subprocess.run(['pdfinfo',str(path)],capture_output=True,text=True,errors='ignore')
              m=re.search(r'^Pages:\s*(\d+)',p.stdout,re.M)
              return int(m.group(1)) if m else 0

          def page_text(path,page):
              p=subprocess.run(['pdftotext','-f',str(page),'-l',str(page),'-layout',str(path),'-'],capture_output=True,text=True,errors='ignore')
              return p.stdout or ''

          tr=str.maketrans('٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹','01234567890123456789')
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s or '')).translate(tr)
              s=re.sub(r'[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]','',s)
              s=re.sub(r'[\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF]','',s)
              s=s.replace('ـ','')
              return re.sub(r'\s+',' ',s).strip()

          deed_patterns=[re.compile(r'(?:رقم\s*الصك\s*[:：-]?\s*)([0-9/\-]{5,30})')]
          judgment_patterns=[re.compile(r'(?:رقم\s*الحكم\s*[:：-]?\s*)([0-9/\-]{4,30})')]
          lawsuit_patterns=[re.compile(r'(?:رقم\s*(?:الدعوى|القضية)\s*[:：-]?\s*)([0-9/\-]{3,30})')]
          date_patterns=[
              re.compile(r'(?:تاريخ\s*(?:الحكم|الصك|القرار|الجلسة)?\s*[:：-]?\s*)([0-9]{1,2}\s*[/\-]\s*[0-9]{1,2}\s*[/\-]\s*1[34][0-9]{2})'),
              re.compile(r'([0-9]{1,2}\s*[/\-]\s*[0-9]{1,2}\s*[/\-]\s*1[34][0-9]{2}\s*هـ?)')
          ]
          court_patterns=[re.compile(r'((?:المحكمة|محكمة)\s+[^\n،؛]{3,100})')]
          circuit_patterns=[re.compile(r'(الدائرة\s+[^\n،؛]{2,80})')]

          def first_match(patterns,text):
              text=norm(text)
              for p in patterns:
                  m=p.search(text)
                  if m: return norm(m.group(1))
              return None

          def title_from(text):
              reject=('رقم الصك','رقم الحكم','رقم الدعوى','رقم القضية','وزارة العدل','المملكة العربية السعودية','تاريخ الحكم','تاريخ الصك')
              lines=[norm(x) for x in text.splitlines() if norm(x)]
              for line in lines:
                  if len(line)>=18 and not any(r in line for r in reject): return line[:500]
              return ''

          records=[]; files=[]; proc=[]; seen=set(); seen_text_hashes=set(); duplicate_cases=[]
          for pdf in pdfs:
              pages=pdf_pages(pdf)
              if pages<=0:
                  proc.append([pdf.name,0,0,'failed','invalid_pdf_or_lfs_pointer']); continue
              source_sha=sha256(pdf); candidates=[]
              for p in range(1,pages+1):
                  txt=page_text(pdf,p)
                  deed=first_match(deed_patterns,txt); judgment=first_match(judgment_patterns,txt); lawsuit=first_match(lawsuit_patterns,txt)
                  if (deed or judgment or lawsuit) and len(norm(txt))>120:
                      candidates.append((p,deed,judgment,lawsuit,txt))
              starts=[]; last_key=None
              for item in candidates:
                  key=(item[1] or '',item[2] or '',item[3] or '')
                  if key==last_key and key!=('','',''): continue
                  starts.append(item); last_key=key
              if not starts:
                  proc.append([pdf.name,pages,0,'needs_review','no_case_boundaries_detected']); continue

              for i,(start,deed,judgment,lawsuit,txt) in enumerate(starts):
                  end=starts[i+1][0]-1 if i+1<len(starts) else pages
                  stable=deed or judgment or lawsuit or f'p{start}'
                  vm=re.search(r'volume-(\d+)',pdf.name); vol=int(vm.group(1)) if vm else None
                  ym=re.search(r'(14\d{2})',pdf.name); source_year=ym.group(1) if ym else None
                  rid=re.sub(r'[^A-Za-z0-9_-]','-',f"collector-{source_year or 'na'}-v{vol or 'na'}-p{start}-{stable}")
                  if rid in seen: continue
                  seen.add(rid)
                  span=subprocess.run(['pdftotext','-f',str(start),'-l',str(end),'-layout',str(pdf),'-'],capture_output=True,text=True,errors='ignore').stdout or txt
                  normalized=norm(span); text_hash=hashlib.sha256(normalized.encode('utf-8')).hexdigest()
                  if text_hash in seen_text_hashes:
                      duplicate_cases.append([rid,pdf.name,start,end,text_hash,'exact_normalized_text']); continue
                  seen_text_hashes.add(text_hash)
                  case_title=title_from(span); decision_date=first_match(date_patterns,span)
                  court=first_match(court_patterns,span); circuit=first_match(circuit_patterns,span)
                  year=(re.search(r'\b(1[34][0-9]{2})\b',decision_date or '') or re.search(r'\b(1[34][0-9]{2})\b',normalized[:1000]))
                  year=year.group(1) if year else source_year
                  out=Path('extracted/collector-judgments')/(rid+'.txt')
                  out.write_text(span,encoding='utf-8')
                  out_sha=sha256(out); size=out.stat().st_size
                  rec={
                      'id':rid,'documentType':'حكم قضائي','caseTitle':case_title,'title':case_title,
                      'caseNumber':lawsuit,'lawsuitNumber':lawsuit,'deedNumber':deed,'judgmentNumber':judgment,
                      'court':court,'circuit':circuit,'decisionDate':decision_date,'hijriDate':decision_date,
                      'volume':vol,'year':year,'sourceFile':pdf.name,'sourceChecksum':source_sha,
                      'file':str(out),'fileChecksum':out_sha,'textChecksum':text_hash,'extractedText':span,
                      'pages':end-start+1,'reviewStatus':'auto_indexed_needs_review',
                      'archive':{'granularity':'case','originalSourceFile':pdf.name,'originalStartPage':start,'originalEndPage':end,'preservedOriginalPages':True}
                  }
                  records.append(rec)
                  files.append([rid,str(out),pdf.name,start,end,end-start+1,out_sha,size,case_title,lawsuit,deed,judgment,court,circuit,decision_date,year,text_hash])
              proc.append([pdf.name,pages,len(starts),'indexed','collector_only'])

          with case_index.open('w',encoding='utf-8') as f:
              for r in records: f.write(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n')
          with file_register.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['id','file','source_file','start_page','end_page','pages','file_sha256','bytes','case_title','case_number','deed_number','judgment_number','court','circuit','decision_date','year','text_sha256']); w.writerows(files)
          with processing.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['source_file','pages','detected_records','status','notes']); w.writerows(proc)
          with open('manifests/collector/case-duplicates.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['candidate_id','source_file','start_page','end_page','text_sha256','match_method']); w.writerows(duplicate_cases)
          Path('manifests/collector/judgment-summary.json').write_text(json.dumps({'source_pdfs':len(pdfs),'judgments':len(records),'exact_duplicates':len(duplicate_cases),'failed_sources':sum(1 for x in proc if x[3]=='failed'),'review_sources':sum(1 for x in proc if x[3]=='needs_review')},ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'INDEXED_RECORDS={len(records)}'); print(f'EXACT_CASE_DUPLICATES={len(duplicate_cases)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extracted/collector-judgments indices/collector manifests/collector
          if ! git diff --cached --quiet; then
            git commit -m 'collector: فهرسة أحكام وزارة العدل بالنص الكامل والحقول القانونية'
            git pull --rebase origin collector-import
            git push origin collector-import
          fi
