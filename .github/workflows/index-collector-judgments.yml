name: Collector - extract standalone Ministry judgment PDFs

on:
  push:
    branches: [collector-import]
    paths:
      - 'archive-sources/**/*.pdf'
      - 'scripts/extract_moj_cases.py'
      - 'scripts/reconcile_collector_source_status.py'
      - 'scripts/validate_collector_archive.py'
      - '.github/workflows/index-collector-judgments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    if: github.ref == 'refs/heads/collector-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-import
          fetch-depth: 1
          lfs: true
      - name: Ensure LFS objects are present
        run: git lfs pull
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
      - name: Extract case PDFs and write collector-only registers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_moj_cases.py --replace
          python3 scripts/reconcile_collector_source_status.py
          python3 scripts/validate_collector_archive.py
      - name: Commit collector-only archive updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            extracted/collector-judgments-pdf \
            indices/collector/case-register.ndjson \
            indices/collector/pending-case-review.ndjson \
            manifests/collector/judgment-file-register.csv \
            manifests/collector/processing-log.csv \
            manifests/collector/case-duplicates.csv \
            manifests/collector/pending-case-duplicates.csv \
            manifests/collector/source-case-counts.csv \
            manifests/collector/skipped-records.csv \
            manifests/collector/judgment-summary.json \
            manifests/collector/pending-source-register.csv \
            manifests/collector/validation-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'collector: فصل أحكام وزارة العدل إلى PDF مستقل'
            git pull --rebase origin collector-import
            git push origin collector-import
          fi
